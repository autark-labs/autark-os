id: radarr
metadata:
  name: Radarr
  category: Media
  description: Movie library manager for monitoring, organizing, and automating films.
  shortValue: Keep movie libraries organized and ready for your media server.
  image: /app-images/radarr.svg
  version: 6.2.1.10461
  maintainer: Radarr Community
  source: GitHub
  sourceUrl: https://github.com/Radarr/Radarr
  documentationUrl: https://wiki.servarr.com/radarr
  difficulty: Advanced
  supportLevel: Needs testing
  supportSummary: Install, first-run setup, private access, and restore still need end-to-end validation.
  accessUrl: http://localhost:7878
  tags:
    - Movies
    - Media automation
    - Library management
    - Arr stack
testing:
  smokeTests:
    - label: AMD64 container startup and restart
      status: Passed
      detail: Checked on 2026-09-27 using Autark-generated Compose with isolated loopback ports and temporary storage. This does not qualify setup, Tailscale, or restore.
    - label: Install, setup, and private access
      status: Needs end-to-end test
      detail: Validate the owner workflow on a clean host, including first-run setup and private access.
    - label: Raspberry Pi runtime
      status: Needs hardware test
      detail: ARM64 image support does not establish Raspberry Pi startup or performance.
    - label: Backup and restore
      status: Needs end-to-end test
      detail: Cold file copying stops the whole app; a populated backup and restore round trip is not yet qualified.

user:
  bestFor:
    - Organizing movie libraries
    - Tracking wanted movies
    - Pairing with download tools
  highlights:
    - Movie monitoring
    - Rename and organize files
    - Integrates with indexers and download clients
  plainLanguage: Radarr helps advanced media users organize movie libraries and can connect to download tools when you choose to configure that workflow.
technical:
  summary: Deploys Radarr with persistent configuration, movies and downloads folders, local dashboard access, and backup metadata.
  requirements:
    - 1 CPU core
    - 512 MB RAM
    - Media storage folders
    - Optional indexer and download client
  includes:
    - Radarr dashboard
    - Configuration storage
    - Movies library mount
    - Downloads mount
  configuration:
    - label: Container name
      value: radarr
    - label: Network
      value: autark-os-apps
    - label: Ports
      value: 7878:7878
    - label: Data storage
      value: /var/lib/autark-os/apps/radarr/config
    - label: Backup
      value: Stops the app to copy its managed data folders
    - label: Access
      value: Local and Tailscale
access:
  kind: web
  defaultMode: local-and-private
  privateAccessRecommended: true
  requiresFirstRunSetup: true
  notes:
    - Dashboard access should stay private because it can control media workflows.
    - Connect indexers and download clients from Radarr's own settings when you are ready.
usage:
  kind: companion-service
  primaryAction: open-dashboard
  openUrlLabel: Open Radarr
  headline: Set up an isolated movie library
  summary: Autark-OS starts Radarr with its own library and downloads folders. Other apps do not share these files, and connectors require manual setup.
  setupSteps:
    - Open Radarr and configure a username, password, and authentication method when prompted.
    - Put existing media in /var/lib/autark-os/apps/radarr/movies on the server, then select /movies as the library root.
    - Configure indexers manually if needed.
    - Only configure a download client after arranging access to the same downloaded files; installing another app does not share its storage.
  fields:
    - label: Dashboard URL
      value: "{accessUrl}"
      sensitive: false
      qr: false
  notes:
    - Backups stop the app and copy managed folders; restore round-trip validation is still pending.
    - This is a power-user media tool. It is not required for Jellyfin playback.
    - This install does not provide a shared media pipeline or automatically connect Jellyfin, Bazarr, or download clients.
setup:
  kind: media-stack
  automation: manual
  copyableFields:
    - label: Dashboard URL
      value: "{accessUrl}"
      sensitive: false
  userSteps:
    - Select /movies as the root folder and review that media and downloads are isolated from other apps.
    - Configure indexers manually from Radarr's settings; download automation additionally requires shared file access not supplied by this installation.
  automationCapabilities: []
health:
  type: http
  path: /
  startupGraceSeconds: 240
  successLabel: Movie manager is ready
  startingLabel: Starting movie manager
  failureLabel: Radarr is not responding
  description: Autark-OS checks that the Radarr dashboard answers before calling it ready.
runtime:
  containerName: radarr
  composeProject: autark-os-radarr
  image: lscr.io/linuxserver/radarr:version-6.2.1.10461
  network: autark-os-apps
  runtimeRoot: /var/lib/autark-os/apps/radarr
  ports:
    - 7878:7878
  volumes:
    - /var/lib/autark-os/apps/radarr/config:/config
    - /var/lib/autark-os/apps/radarr/movies:/movies
    - /var/lib/autark-os/apps/radarr/downloads:/downloads
  environment:
    - TZ=UTC
  labels:
    - autark-os.managed=true
    - autark-os.app-id=radarr
    - autark-os.version=6.2.1.10461
  backupPaths:
    - config
    - movies
    - downloads
  backupStrategy: cold_file
  backupContractVersion: 1
  privileged: false

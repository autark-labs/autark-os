id: memos
metadata:
  name: Memos
  category: Productivity
  description: Lightweight personal notes and quick knowledge capture.
  shortValue: A private notes app for thoughts, links, snippets, and logs.
  image: /app-images/memos.svg
  version: 0.29.1
  maintainer: Memos Community
  source: GitHub
  sourceUrl: https://github.com/usememos/memos
  documentationUrl: https://www.usememos.com/docs
  difficulty: Easy
  supportLevel: Needs testing
  supportSummary: Install, first-run setup, private access, and restore still need end-to-end validation.
  accessUrl: http://localhost:5230
  tags:
    - Notes
    - Knowledge base
    - Markdown
    - Journaling
testing:
  smokeTests:
    - label: AMD64 container startup and restart
      status: Passed
      detail: Checked on 2026-09-27 using Autark-generated Compose with isolated loopback ports and temporary storage. This does not qualify setup, Tailscale, or restore.
    - label: Install, setup, and private access
      status: Needs end-to-end test
      detail: Validate the owner workflow on a clean host, including first-run setup and private access.
    - label: Raspberry Pi runtime
      status: Needs hardware test
      detail: ARM64 image support does not establish Raspberry Pi startup or performance.
    - label: Backup and restore
      status: Needs end-to-end test
      detail: Cold file copying stops the whole app; a populated backup and restore round trip is not yet qualified.

user:
  bestFor:
    - Quick notes
    - Personal knowledge capture
    - Saving links and snippets
  highlights:
    - Fast note entry
    - Markdown support
    - Private self-hosted storage
  plainLanguage: Memos gives you a small private notes space for reminders, links, snippets, and lightweight documentation.
technical:
  summary: Deploys Memos with persistent data storage, a local web dashboard, and backup metadata.
  requirements:
    - 1 CPU core
    - 256 MB RAM
    - Persistent storage volume
  includes:
    - Memos web app
    - SQLite-backed data folder
    - Local dashboard port
    - Backup profile
  configuration:
    - label: Container name
      value: memos
    - label: Network
      value: autark-os-apps
    - label: Ports
      value: 5230:5230
    - label: Data storage
      value: /var/lib/autark-os/apps/memos/data
    - label: Backup
      value: Stops the app to copy its managed data folders
    - label: Access
      value: Tailscale recommended
access:
  kind: web
  defaultMode: private
  privateAccessRecommended: true
  requiresFirstRunSetup: true
  notes:
    - Private access is recommended because notes often contain sensitive personal information.
    - First-run setup creates the first user and workspace preferences.
usage:
  kind: web-app
  primaryAction: open-dashboard
  openUrlLabel: Open Memos
  headline: Start a private notes space
  summary: Open Memos, create the first account, then add a note to confirm the workspace is ready.
  setupSteps:
    - Open Memos and create the first user account.
    - Create a test note and confirm it remains after refreshing the page.
    - Keep access private if your notes include personal or work information.
  fields:
    - label: Web UI
      value: "{accessUrl}"
      sensitive: false
      qr: false
  notes:
    - Backups stop the app and copy managed folders; restore round-trip validation is still pending.
    - Use a private access link rather than a public URL for personal notes.
health:
  type: http
  path: /
  startupGraceSeconds: 180
  successLabel: Notes service is ready
  startingLabel: Starting Memos
  failureLabel: Memos is not responding
  description: Autark-OS checks that the Memos web interface answers.
runtime:
  containerName: memos
  composeProject: autark-os-memos
  image: ghcr.io/usememos/memos:0.29.1
  network: autark-os-apps
  runtimeRoot: /var/lib/autark-os/apps/memos
  ports:
    - 5230:5230
  volumes:
    - /var/lib/autark-os/apps/memos/data:/var/opt/memos
  labels:
    - autark-os.managed=true
    - autark-os.app-id=memos
    - autark-os.version=0.29.1
  backupPaths:
    - data
  backupStrategy: cold_file
  backupContractVersion: 1
  privileged: false

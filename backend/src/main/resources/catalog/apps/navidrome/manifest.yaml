id: navidrome
metadata:
  name: "Navidrome"
  category: Media
  description: "Stream your personal music collection through a web player or compatible client."
  shortValue: "Stream your personal music collection through a web player or compatible client."
  image: /app-images/navidrome.svg
  version: "0.64.2"
  source: GitHub
  sourceUrl: https://github.com/navidrome/navidrome
  documentationUrl: https://www.navidrome.org/docs/installation/docker/
  difficulty: Easy
  supportLevel: Needs testing
  supportSummary: Upstream image supports amd64 and arm64; the complete installation and restore workflow needs validation.
  accessUrl: http://localhost:18002
testing:
  smokeTests:
    - label: AMD64 container startup and restart
      status: Passed
      detail: Checked on 2026-09-27 using Autark-generated Compose with isolated loopback ports and temporary storage. This does not qualify setup, Tailscale, or restore.
    - label: Image architectures
      status: Passed
      detail: Registry index inspected on 2026-09-27; the pinned digest includes linux/amd64 and linux/arm64.
    - label: Install, first setup, private access, backup and restore
      status: Needs end-to-end test
      detail: Container startup and restart passed locally; browser setup, private access, and restore still need validation.
    - label: ARM64 runtime
      status: Needs hardware test
      detail: Image availability does not establish operation on ARM64 hardware.
user:
  plainLanguage: "Stream your personal music collection through a web player or compatible client."
  bestFor: ["Set up your music library"]
technical:
  summary: "Runs Navidrome as one container with managed storage. Backups stop the app while copying all declared data folders."
  requirements:
    - 512 MB RAM
    - Local persistent storage with space for your content
  includes:
    - "Navidrome web interface"
    - Managed data folders and cold backup contract
access:
  kind: web
  privateDashboard: true
  defaultMode: private
  privateAccessRecommended: true
  requiresFirstRunSetup: true
  notes:
    - Keep access private while completing account and permission setup.
usage:
  kind: web-app
  primaryAction: open-dashboard
  openUrlLabel: "Open Navidrome"
  headline: "Set up your music library"
  summary: "Create the administrator account and add music to the managed music folder before scanning."
  setupSteps:
    - "Open Navidrome and create the first administrator account."
    - "Copy music files into /var/lib/autark-os/apps/navidrome/music on the server; Navidrome does not provide a music upload screen."
    - "Scan the music folder in Navidrome, then play a track."
  notes:
    - "Music files and the database are included in backups."
    - "Other media apps use separate folders; libraries are not connected automatically."
  fields:
    - label: Web interface
      value: "{accessUrl}"
      sensitive: false
      qr: false
setup:
  kind: basic
  automation: manual
health:
  type: http
  path: /
  startupGraceSeconds: 300
  successLabel: "Navidrome web interface is responding"
  startingLabel: "Starting Navidrome"
  failureLabel: "Navidrome is not responding"
  description: Checks the web interface; account setup and app configuration may still be required.
runtime:
  containerName: navidrome
  composeProject: autark-os-navidrome
  image: deluan/navidrome@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
  network: autark-os-apps
  runtimeRoot: /var/lib/autark-os/apps/navidrome
  ports:
    - 18002:4533
  volumes:
    - /var/lib/autark-os/apps/navidrome/data:/data
    - /var/lib/autark-os/apps/navidrome/music:/music
  environment:
    - TZ=UTC
  labels:
    - autark-os.managed=true
    - autark-os.app-id=navidrome
    - autark-os.version=0.64.2
  backupPaths:
    - data
    - music
  backupStrategy: cold_file
  backupContractVersion: 1
  privileged: false

id: audiobookshelf
metadata:
  name: "Audiobookshelf"
  category: Media
  description: "Listen to your audiobooks and podcasts from a personal library."
  shortValue: "Listen to your audiobooks and podcasts from a personal library."
  image: /app-images/audiobookshelf.svg
  version: "2.36.1"
  source: GitHub
  sourceUrl: https://github.com/advplyr/audiobookshelf
  documentationUrl: https://audiobookshelf.org/docs/documentation/install/docker/
  difficulty: Easy
  supportLevel: Needs testing
  supportSummary: Upstream image supports amd64 and arm64; the complete installation and restore workflow needs validation.
  accessUrl: http://localhost:18001
testing:
  smokeTests:
    - label: AMD64 container startup and restart
      status: Passed
      detail: Checked on 2026-09-27 using Autark-generated Compose with isolated loopback ports and temporary storage. This does not qualify setup, Tailscale, or restore.
    - label: Image architectures
      status: Passed
      detail: Registry index inspected on 2026-09-27; the pinned digest includes linux/amd64 and linux/arm64.
    - label: Install, first setup, private access, backup and restore
      status: Needs end-to-end test
      detail: Container startup and restart passed locally; browser setup, private access, and restore still need validation.
    - label: ARM64 runtime
      status: Needs hardware test
      detail: Image availability does not establish operation on ARM64 hardware.
user:
  plainLanguage: "Listen to your audiobooks and podcasts from a personal library."
  bestFor: ["Build your audiobook library"]
technical:
  summary: "Runs Audiobookshelf as one container with managed storage. Backups stop the app while copying all declared data folders."
  requirements:
    - 1 GB RAM
    - Local persistent storage with space for your content
  includes:
    - "Audiobookshelf web interface"
    - Managed data folders and cold backup contract
access:
  kind: web
  privateDashboard: true
  defaultMode: private
  privateAccessRecommended: true
  requiresFirstRunSetup: true
  notes:
    - Keep access private while completing account and permission setup.
usage:
  kind: web-app
  primaryAction: open-dashboard
  openUrlLabel: "Open Audiobookshelf"
  headline: "Build your audiobook library"
  summary: "Create an administrator, add a library, and upload an audiobook or subscribe to a podcast."
  setupSteps:
    - "Open Audiobookshelf and create the administrator account with a strong password."
    - "Create a library using /audiobooks, or a podcast library using /podcasts."
    - "Upload a book through Audiobookshelf or add a podcast, then test playback."
  notes:
    - "Books, podcasts, metadata, and configuration are included in backups."
    - "Private browser access needs WebSocket support for playback and library updates."
  fields:
    - label: Web interface
      value: "{accessUrl}"
      sensitive: false
      qr: false
setup:
  kind: basic
  automation: manual
health:
  type: http
  path: /
  startupGraceSeconds: 300
  successLabel: "Audiobookshelf web interface is responding"
  startingLabel: "Starting Audiobookshelf"
  failureLabel: "Audiobookshelf is not responding"
  description: Checks the web interface; account setup and app configuration may still be required.
runtime:
  containerName: audiobookshelf
  composeProject: autark-os-audiobookshelf
  image: ghcr.io/advplyr/audiobookshelf@sha256:3528a93b6442ffe54bd46771bbbab7c97084e1101071586d9dc2254f30bb4358
  network: autark-os-apps
  runtimeRoot: /var/lib/autark-os/apps/audiobookshelf
  ports:
    - 18001:80
  volumes:
    - /var/lib/autark-os/apps/audiobookshelf/config:/config
    - /var/lib/autark-os/apps/audiobookshelf/metadata:/metadata
    - /var/lib/autark-os/apps/audiobookshelf/audiobooks:/audiobooks
    - /var/lib/autark-os/apps/audiobookshelf/podcasts:/podcasts
  environment:
    - TZ=UTC
  labels:
    - autark-os.managed=true
    - autark-os.app-id=audiobookshelf
    - autark-os.version=2.36.1
  backupPaths:
    - config
    - metadata
    - audiobooks
    - podcasts
  backupStrategy: cold_file
  backupContractVersion: 1
  privileged: false

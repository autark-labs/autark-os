id: actual-budget
metadata:
  name: Actual Budget
  category: Productivity
  description: Private envelope budgeting and personal finance tracking.
  shortValue: Run a private budgeting app for household finances.
  image: /app-images/actual-budget.svg
  version: 26.6.0
  maintainer: Actual Budget Community
  source: GitHub
  sourceUrl: https://github.com/actualbudget/actual
  documentationUrl: https://actualbudget.org/docs/
  difficulty: Easy
  supportLevel: Needs testing
  supportSummary: Install, first-run setup, private access, and restore still need end-to-end validation.
  accessUrl: http://localhost:5006
  tags:
    - Budgeting
    - Finance
    - Household
    - Privacy
testing:
  smokeTests:
    - label: AMD64 container startup and restart
      status: Passed
      detail: Checked on 2026-09-27 using Autark-generated Compose with isolated loopback ports and temporary storage. This does not qualify setup, Tailscale, or restore.
    - label: Install, setup, and private access
      status: Needs end-to-end test
      detail: Validate the owner workflow on a clean host, including first-run setup and private access.
    - label: Raspberry Pi runtime
      status: Needs hardware test
      detail: ARM64 image support does not establish Raspberry Pi startup or performance.
    - label: Backup and restore
      status: Needs end-to-end test
      detail: Cold file copying stops the whole app; a populated backup and restore round trip is not yet qualified.

user:
  bestFor:
    - Household budgets
    - Expense tracking
    - Private finance records
  highlights:
    - Envelope-style budgeting
    - Private local data
    - Sync server for clients
  plainLanguage: Actual Budget gives you a private place to manage household budgets and spending without putting finance records in a public cloud.
technical:
  summary: Deploys Actual Budget with persistent server files, local web access, and backup metadata.
  requirements:
    - 1 CPU core
    - 256 MB RAM
    - Persistent storage volume
  includes:
    - Actual Budget server
    - Budget files storage
    - Local dashboard
    - Backup profile
  configuration:
    - label: Container name
      value: actual-budget
    - label: Network
      value: autark-os-apps
    - label: Ports
      value: 5006:5006
    - label: Data storage
      value: /var/lib/autark-os/apps/actual-budget/data
    - label: Backup
      value: Stops the app to copy its managed data folders
    - label: Access
      value: Private
access:
  kind: web
  privateDashboard: true
  defaultMode: private
  privateAccessRecommended: true
  requiresFirstRunSetup: true
  notes:
    - Private HTTPS is required for this installation because Actual Budget needs a secure browser context.
    - First-run setup creates or imports a budget file.
usage:
  kind: web-app
  privateHttpsRequired: true
  primaryAction: open-dashboard
  openUrlLabel: Open Actual Budget
  headline: Start a private household budget
  summary: Autark-OS starts Actual Budget and prepares storage. Create or import your first budget in the app.
  setupSteps:
    - Enable private HTTPS access in Autark-OS Access, then open Actual Budget using that HTTPS link.
    - Create the server password, then create or import a budget.
    - Use the same private HTTPS address on your other devices; ordinary LAN HTTP lacks required browser features.
  fields:
    - label: Budget URL
      value: "{accessUrl}"
      sensitive: false
      qr: true
  notes:
    - Backups stop the app and copy managed folders; restore round-trip validation is still pending.
    - Backups are important because this stores finance records.
health:
  type: http
  path: /
  startupGraceSeconds: 180
  successLabel: Budget app is ready
  startingLabel: Starting budget app
  failureLabel: Actual Budget is not responding
  description: Autark-OS checks that the Actual Budget app answers before calling it ready.
runtime:
  containerName: actual-budget
  composeProject: autark-os-actual-budget
  image: actualbudget/actual-server:26.6.0
  network: autark-os-apps
  runtimeRoot: /var/lib/autark-os/apps/actual-budget
  ports:
    - 5006:5006
  volumes:
    - /var/lib/autark-os/apps/actual-budget/data:/data
  labels:
    - autark-os.managed=true
    - autark-os.app-id=actual-budget
    - autark-os.version=26.6.0
  backupPaths:
    - data
  backupStrategy: cold_file
  backupContractVersion: 1
  privileged: false

id: sonarr
metadata:
  name: Sonarr
  category: Media
  description: TV library manager for monitoring, organizing, and automating episodes.
  shortValue: Keep TV libraries organized and monitored from one dashboard.
  image: /app-images/sonarr.svg
  version: 4.0.19.2979
  maintainer: Sonarr Community
  source: GitHub
  sourceUrl: https://github.com/Sonarr/Sonarr
  documentationUrl: https://wiki.servarr.com/sonarr
  difficulty: Advanced
  supportLevel: Needs testing
  supportSummary: Install, first-run setup, private access, and restore still need end-to-end validation.
  accessUrl: http://localhost:8989
  tags:
    - TV
    - Media automation
    - Library management
    - Arr stack
testing:
  smokeTests:
    - label: AMD64 container startup and restart
      status: Passed
      detail: Checked on 2026-09-27 using Autark-generated Compose with isolated loopback ports and temporary storage. This does not qualify setup, Tailscale, or restore.
    - label: Install, setup, and private access
      status: Needs end-to-end test
      detail: Validate the owner workflow on a clean host, including first-run setup and private access.
    - label: Raspberry Pi runtime
      status: Needs hardware test
      detail: ARM64 image support does not establish Raspberry Pi startup or performance.
    - label: Backup and restore
      status: Needs end-to-end test
      detail: Cold file copying stops the whole app; a populated backup and restore round trip is not yet qualified.

user:
  bestFor:
    - Organizing TV libraries
    - Tracking wanted episodes
    - Pairing with download tools
  highlights:
    - TV series monitoring
    - Rename and organize episodes
    - Integrates with indexers and download clients
  plainLanguage: Sonarr helps advanced media users keep TV libraries organized and can connect to download tools when you choose to configure that workflow.
technical:
  summary: Deploys Sonarr with persistent configuration, TV and downloads folders, local dashboard access, and backup metadata.
  requirements:
    - 1 CPU core
    - 512 MB RAM
    - Media storage folders
    - Optional indexer and download client
  includes:
    - Sonarr dashboard
    - Configuration storage
    - TV library mount
    - Downloads mount
  configuration:
    - label: Container name
      value: sonarr
    - label: Network
      value: autark-os-apps
    - label: Ports
      value: 8989:8989
    - label: Data storage
      value: /var/lib/autark-os/apps/sonarr/config
    - label: Backup
      value: Stops the app to copy its managed data folders
    - label: Access
      value: Local and Tailscale
access:
  kind: web
  defaultMode: local-and-private
  privateAccessRecommended: true
  requiresFirstRunSetup: true
  notes:
    - Dashboard access should stay private because it can control media workflows.
    - Connect indexers and download clients from Sonarr's own settings when you are ready.
usage:
  kind: companion-service
  primaryAction: open-dashboard
  openUrlLabel: Open Sonarr
  headline: Set up an isolated TV library
  summary: Autark-OS starts Sonarr with its own library and downloads folders. Other apps do not share these files, and connectors require manual setup.
  setupSteps:
    - Open Sonarr and configure a username, password, and authentication method when prompted.
    - Put existing media in /var/lib/autark-os/apps/sonarr/tv on the server, then select /tv as the library root.
    - Configure indexers manually if needed.
    - Only configure a download client after arranging access to the same downloaded files; installing another app does not share its storage.
  fields:
    - label: Dashboard URL
      value: "{accessUrl}"
      sensitive: false
      qr: false
  notes:
    - Backups stop the app and copy managed folders; restore round-trip validation is still pending.
    - This is a power-user media tool. It is not required for Jellyfin playback.
    - This install does not provide a shared media pipeline or automatically connect Jellyfin, Bazarr, or download clients.
setup:
  kind: media-stack
  automation: manual
  copyableFields:
    - label: Dashboard URL
      value: "{accessUrl}"
      sensitive: false
  userSteps:
    - Select /tv as the root folder and review that media and downloads are isolated from other apps.
    - Configure indexers manually from Sonarr's settings; download automation additionally requires shared file access not supplied by this installation.
  automationCapabilities: []
health:
  type: http
  path: /
  startupGraceSeconds: 240
  successLabel: TV manager is ready
  startingLabel: Starting TV manager
  failureLabel: Sonarr is not responding
  description: Autark-OS checks that the Sonarr dashboard answers before calling it ready.
runtime:
  containerName: sonarr
  composeProject: autark-os-sonarr
  image: lscr.io/linuxserver/sonarr:version-4.0.19.2979
  network: autark-os-apps
  runtimeRoot: /var/lib/autark-os/apps/sonarr
  ports:
    - 8989:8989
  volumes:
    - /var/lib/autark-os/apps/sonarr/config:/config
    - /var/lib/autark-os/apps/sonarr/tv:/tv
    - /var/lib/autark-os/apps/sonarr/downloads:/downloads
  environment:
    - TZ=UTC
  labels:
    - autark-os.managed=true
    - autark-os.app-id=sonarr
    - autark-os.version=4.0.19.2979
  backupPaths:
    - config
    - tv
    - downloads
  backupStrategy: cold_file
  backupContractVersion: 1
  privileged: false

id: jellyfin
metadata:
  name: Jellyfin
  category: Media
  description: Stream movies, shows, music, and home videos from your server.
  shortValue: Your own Netflix-style media library with no subscription.
  image: /app-images/jellyfin.svg
  version: 10.11.11
  maintainer: Jellyfin Project
  source: GitHub
  sourceUrl: https://github.com/jellyfin/jellyfin
  documentationUrl: https://jellyfin.org/docs/
  difficulty: Easy
  supportLevel: Needs testing
  supportSummary: Install, first-run setup, private access, and restore still need end-to-end validation.
  accessUrl: http://localhost:8096
  tags:
    - Movies
    - Music
    - Streaming
    - Media library
testing:
  smokeTests:
    - label: AMD64 container startup and restart
      status: Passed
      detail: Checked on 2026-09-27 using Autark-generated Compose with isolated loopback ports and temporary storage. This does not qualify setup, Tailscale, or restore.
    - label: Install, setup, and private access
      status: Needs end-to-end test
      detail: Validate the owner workflow on a clean host, including first-run setup and private access.
    - label: Raspberry Pi runtime
      status: Needs hardware test
      detail: ARM64 image support does not establish Raspberry Pi startup or performance.
    - label: Backup and restore
      status: Needs end-to-end test
      detail: Cold file copying stops the whole app; a populated backup and restore round trip is not yet qualified.

user:
  bestFor:
    - Movies and TV
    - Music libraries
    - Streaming around the house
  highlights:
    - No paid account required
    - User profiles
    - Direct playback and software transcoding
  plainLanguage: Jellyfin organizes your media and makes it easy to stream from TVs, phones, tablets, and browsers around your home.
technical:
  summary: Deploys Jellyfin with an isolated media folder, persistent configuration, and software transcoding; GPU devices are not passed through.
  requirements:
    - 1 CPU core
    - 1 GB RAM
    - Media storage location
    - CPU capacity for software transcoding when direct playback is unavailable
  includes:
    - Jellyfin server
    - Config volume
    - Media mounts
    - Software transcoding
  configuration:
    - label: Container name
      value: jellyfin
    - label: Network
      value: autark-os-media
    - label: Ports
      value: 8096:8096
    - label: Data storage
      value: /var/lib/autark-os/apps/jellyfin/config
    - label: Backup
      value: Stops the app to copy its managed data folders
    - label: Access
      value: Local network and Tailscale
access:
  kind: web
  defaultMode: local-and-private
  privateAccessRecommended: true
  requiresFirstRunSetup: true
  notes:
    - Local access is useful for TVs and streaming boxes at home.
    - Private access helps phones and laptops stream while away without opening a public port.
usage:
  kind: web-app
  primaryAction: open-dashboard
  openUrlLabel: Open Jellyfin
  headline: Build your private media library
  summary: Open Jellyfin, create the administrator account, and add the media folders you want to share.
  setupSteps:
    - Open Jellyfin and create the administrator account.
    - Copy a small media sample into /var/lib/autark-os/apps/jellyfin/media on the server, then add /media as the library path in Jellyfin.
    - Add household user profiles and trusted playback devices.
  fields:
    - label: Web UI
      value: "{accessUrl}"
      sensitive: false
      qr: false
  notes:
    - Backups stop the app and copy managed folders; restore round-trip validation is still pending.
    - Keep remote streaming on the private access link instead of exposing a public port.
    - This media folder is separate from other apps; Autark-OS does not import their libraries automatically.
health:
  type: http
  path: /health
  startupGraceSeconds: 240
  successLabel: Media server is ready
  startingLabel: Starting Jellyfin
  failureLabel: Jellyfin is not responding
  description: Autark-OS checks Jellyfin's health endpoint before calling the media server ready.
runtime:
  containerName: jellyfin
  composeProject: autark-os-jellyfin
  image: jellyfin/jellyfin:10.11.11
  network: autark-os-media
  runtimeRoot: /var/lib/autark-os/apps/jellyfin
  ports:
    - 8096:8096
  volumes:
    - /var/lib/autark-os/apps/jellyfin/config:/config
    - /var/lib/autark-os/apps/jellyfin/cache:/cache
    - /var/lib/autark-os/apps/jellyfin/media:/media
  labels:
    - autark-os.managed=true
    - autark-os.app-id=jellyfin
    - autark-os.version=10.11.11
  backupPaths:
    - config
    - cache
    - media
  backupStrategy: cold_file
  backupContractVersion: 1
  privileged: false

id: gitea
metadata:
  name: Gitea
  category: Development
  description: Host private Git repositories, issues, releases, and project notes.
  shortValue: A lightweight private GitHub-style home for your code.
  image: /app-images/gitea.svg
  version: 1.26.4
  maintainer: Gitea
  source: GitHub
  sourceUrl: https://github.com/go-gitea/gitea
  documentationUrl: https://docs.gitea.com/
  difficulty: Moderate
  supportLevel: Needs testing
  supportSummary: Install, first-run setup, private access, and restore still need end-to-end validation.
  accessUrl: http://localhost:3002
  tags:
    - Git
    - Code hosting
    - Issues
    - Development
testing:
  smokeTests:
    - label: AMD64 container startup and restart
      status: Passed
      detail: Checked on 2026-09-27 using Autark-generated Compose with isolated loopback ports and temporary storage. This does not qualify setup, Tailscale, or restore.
    - label: Install, setup, and private access
      status: Needs end-to-end test
      detail: Validate the owner workflow on a clean host, including first-run setup and private access.
    - label: Raspberry Pi runtime
      status: Needs hardware test
      detail: ARM64 image support does not establish Raspberry Pi startup or performance.
    - label: Backup and restore
      status: Needs end-to-end test
      detail: Cold file copying stops the whole app; a populated backup and restore round trip is not yet qualified.

user:
  bestFor:
    - Private Git repositories
    - Homelab scripts
    - Small team code projects
  highlights:
    - Web Git interface
    - Issues and releases
    - SSH and HTTP Git access
  plainLanguage: Gitea gives you a private place to store code, scripts, and project history without relying on a public code hosting account.
technical:
  summary: Deploys Gitea with persistent repository storage, web access, SSH Git access, and backup metadata.
  requirements:
    - 1 CPU core
    - 1 GB RAM
    - Persistent storage volume
    - Optional SSH access for Git clients
  includes:
    - Gitea web app
    - Git repository storage
    - SSH access port
    - Backup profile
  configuration:
    - label: Container name
      value: gitea
    - label: Network
      value: autark-os-apps
    - label: Ports
      value: 3002:3000, 2222:22
    - label: Data storage
      value: /var/lib/autark-os/apps/gitea/data
    - label: Backup
      value: Stops the app to copy its managed data folders
    - label: Access
      value: Local and Tailscale
access:
  kind: multi-port
  defaultMode: local-and-private
  privateAccessRecommended: true
  requiresFirstRunSetup: true
  notes:
    - Private access is recommended for the web UI and private repositories.
    - SSH Git access can stay local or be used privately through trusted network paths.
usage:
  kind: web-app
  primaryAction: open-dashboard
  openUrlLabel: Open Gitea
  headline: Create your first private Git account
  summary: Complete Gitea's installation with its local SQLite3 database, create the administrator account, then add a repository.
  setupSteps:
    - Open Gitea and select SQLite3 in the installation wizard; keep its database under /data/gitea.
    - Set the server domain and base URL to the address you will use, and set the advertised SSH port to 2222.
    - Create the administrator account before completing installation.
    - Create a repository or import one from another Git service.
    - Add a trusted device or SSH key before pushing code.
  fields:
    - label: Web UI
      value: "{accessUrl}"
      sensitive: false
      qr: false
  notes:
    - Backups stop the app and copy managed folders; restore round-trip validation is still pending.
    - Keep the web UI and repositories on your local network or private access link.
    - This backup profile covers SQLite and repositories under /data only; do not select an external database.
health:
  type: http
  path: /
  startupGraceSeconds: 240
  successLabel: Git service is ready
  startingLabel: Starting Gitea
  failureLabel: Gitea is not responding
  description: Autark-OS checks that the Gitea web interface answers.
runtime:
  containerName: gitea
  composeProject: autark-os-gitea
  image: gitea/gitea:1.26.4
  network: autark-os-apps
  runtimeRoot: /var/lib/autark-os/apps/gitea
  ports:
    - 3002:3000
    - "2222:22"
  volumes:
    - /var/lib/autark-os/apps/gitea/data:/data
  labels:
    - autark-os.managed=true
    - autark-os.app-id=gitea
    - autark-os.version=1.26.4
  backupPaths:
    - data
  backupStrategy: cold_file
  backupContractVersion: 1
  privileged: false

id: prowlarr
metadata:
  name: Prowlarr
  category: Media
  description: Indexer manager for Sonarr, Radarr, and other media automation tools.
  shortValue: Manage media indexers once and share them with compatible apps.
  image: /app-images/prowlarr.svg
  version: 2.4.0.5397
  maintainer: Prowlarr Community
  source: GitHub
  sourceUrl: https://github.com/Prowlarr/Prowlarr
  documentationUrl: https://wiki.servarr.com/prowlarr
  difficulty: Advanced
  supportLevel: Needs testing
  supportSummary: Install, first-run setup, private access, and restore still need end-to-end validation.
  accessUrl: http://localhost:9696
  tags:
    - Indexers
    - Media automation
    - Arr stack
    - Advanced
testing:
  smokeTests:
    - label: AMD64 container startup and restart
      status: Passed
      detail: Checked on 2026-09-27 using Autark-generated Compose with isolated loopback ports and temporary storage. This does not qualify setup, Tailscale, or restore.
    - label: Install, setup, and private access
      status: Needs end-to-end test
      detail: Validate the owner workflow on a clean host, including first-run setup and private access.
    - label: Raspberry Pi runtime
      status: Needs hardware test
      detail: ARM64 image support does not establish Raspberry Pi startup or performance.
    - label: Backup and restore
      status: Needs end-to-end test
      detail: Cold file copying stops the whole app; a populated backup and restore round trip is not yet qualified.

user:
  bestFor:
    - Managing indexers
    - Connecting Sonarr and Radarr
    - Reducing repeated media setup
  highlights:
    - Central indexer management
    - Sonarr and Radarr sync
    - Advanced media workflows
  plainLanguage: Prowlarr helps advanced media users connect indexers to Sonarr, Radarr, and similar tools from one place.
technical:
  summary: Deploys Prowlarr with persistent configuration, local dashboard access, and backup metadata.
  requirements:
    - 1 CPU core
    - 512 MB RAM
    - Compatible media automation apps
  includes:
    - Prowlarr dashboard
    - Indexer configuration storage
    - App integration settings
    - Backup profile
  configuration:
    - label: Container name
      value: prowlarr
    - label: Network
      value: autark-os-apps
    - label: Ports
      value: 9696:9696
    - label: Data storage
      value: /var/lib/autark-os/apps/prowlarr/config
    - label: Backup
      value: Stops the app to copy its managed data folders
    - label: Access
      value: Local and Tailscale
access:
  kind: web
  defaultMode: local-and-private
  privateAccessRecommended: true
  requiresFirstRunSetup: true
  notes:
    - Dashboard access should stay private because it stores indexer and app credentials.
    - Connect companion media apps from Prowlarr's own settings when you are ready.
usage:
  kind: companion-service
  primaryAction: open-dashboard
  openUrlLabel: Open Prowlarr
  headline: Centralize media indexers
  summary: Autark-OS starts Prowlarr. Add indexers and connect compatible media apps from the dashboard.
  setupSteps:
    - Open Prowlarr and configure a username, password, and authentication method when prompted.
    - Add indexers you are allowed to use.
    - Connect Sonarr, Radarr, or other compatible apps manually using their reachable URLs and API keys.
  fields:
    - label: Dashboard URL
      value: "{accessUrl}"
      sensitive: false
      qr: false
  notes:
    - Backups stop the app and copy managed folders; restore round-trip validation is still pending.
    - Prowlarr is an advanced companion service, not a media player. No app connections are created automatically.
setup:
  kind: media-stack
  automation: manual
  copyableFields:
    - label: Dashboard URL
      value: "{accessUrl}"
      sensitive: false
  userSteps:
    - Add only indexers you are allowed to use.
    - Configure Sonarr or Radarr connections manually from Prowlarr's Apps settings.
  automationCapabilities: []
health:
  type: http
  path: /
  startupGraceSeconds: 240
  successLabel: Indexer manager is ready
  startingLabel: Starting indexer manager
  failureLabel: Prowlarr is not responding
  description: Autark-OS checks that the Prowlarr dashboard answers before calling it ready.
runtime:
  containerName: prowlarr
  composeProject: autark-os-prowlarr
  image: lscr.io/linuxserver/prowlarr:version-2.4.0.5397
  network: autark-os-apps
  runtimeRoot: /var/lib/autark-os/apps/prowlarr
  ports:
    - 9696:9696
  volumes:
    - /var/lib/autark-os/apps/prowlarr/config:/config
  environment:
    - TZ=UTC
  labels:
    - autark-os.managed=true
    - autark-os.app-id=prowlarr
    - autark-os.version=2.4.0.5397
  backupPaths:
    - config
  backupStrategy: cold_file
  backupContractVersion: 1
  privileged: false

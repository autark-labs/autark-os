id: grav
metadata:
  name: "Grav"
  category: Productivity
  description: "Create a small private website without a database server."
  shortValue: "Create a small private website without a database server."
  image: /app-images/grav.svg
  version: "2.2.1-ls282"
  maintainer: "LinuxServer.io"
  source: GitHub
  sourceUrl: https://github.com/getgrav/grav
  documentationUrl: https://docs.linuxserver.io/images/docker-grav/
  difficulty: Moderate
  supportLevel: Needs testing
  supportSummary: ARM64 image availability checked; full Pi lifecycle qualification is pending.
  accessUrl: http://localhost:18018
  tags: ["Productivity", "Self-hosted"]
testing:
  smokeTests:
    - label: AMD64 container startup and restart
      status: Passed
      detail: Checked on 2026-09-27 using Autark-generated Compose with isolated loopback ports and temporary storage. This does not qualify setup, Tailscale, or restore.
    - label: Image architectures
      status: Passed
      detail: Pinned registry index includes linux/amd64 and linux/arm64.
    - label: Appliance lifecycle
      status: Needs end-to-end test
      detail: Install, first-run setup, private access, backup and restore require appliance testing.
user:
  plainLanguage: "Create a small private website without a database server."
  bestFor: ["Create a small private website without a database server."]
  highlights: [Managed local storage, Private browser access]
technical:
  summary: Single container with managed persistent folders and stopped-app file backups.
  requirements: [64-bit Docker host, Local disk for persistent data]
  includes: ["Grav", Managed data folders]
access:
  kind: web
  defaultMode: private
  privateAccessRecommended: true
  privateDashboard: true
  requiresFirstRunSetup: true
  notes:
    - Dashboard access is limited to this server or trusted Tailscale devices.
usage:
  kind: web-app
  primaryAction: open-dashboard
  openUrlLabel: "Open Grav"
  headline: "Set up Grav"
  summary: "Create a small private website without a database server."
  setupSteps:
    - "Open /admin on the app link and create an administrator account."
    - "Use the page editor to write your first page."
  notes:
    - "This template keeps the site private; it does not publish a public website."
health:
  type: http
  path: /
  startupGraceSeconds: 300
  successLabel: Ready to open
  startingLabel: Starting app
  failureLabel: App is not responding
  description: Checks the web endpoint; complete the upstream setup before using the app.
runtime:
  containerName: grav
  composeProject: autark-os-grav
  image: lscr.io/linuxserver/grav@sha256:317c5ad9897bd47349d99be49550020824fbfdbf5be63ef014b134fc00d56c0e
  network: autark-os-apps
  runtimeRoot: /var/lib/autark-os/apps/grav
  ports: ["18018:80"]
  volumes:
    - "/var/lib/autark-os/apps/grav/config:/config"
  environment: ["PUID=1000","PGID=1000","TZ=Etc/UTC"]
  labels: ["autark-os.managed=true", "autark-os.app-id=grav"]
  backupPaths: ["config"]
  backupStrategy: cold_file
  backupContractVersion: 1
  privileged: false

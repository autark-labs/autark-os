id: vaultwarden
metadata:
  name: Vaultwarden
  category: Security
  description: A private password vault that works with Bitwarden apps.
  shortValue: Store family or team passwords safely without relying on a cloud account.
  image: /app-images/vaultwarden.svg
  version: 1.36.0
  maintainer: Vaultwarden Community
  source: GitHub
  sourceUrl: https://github.com/dani-garcia/vaultwarden
  documentationUrl: https://github.com/dani-garcia/vaultwarden/wiki
  difficulty: Easy
  supportLevel: Needs testing
  supportSummary: Install, first-run setup, private access, and restore still need end-to-end validation.
  accessUrl: http://localhost:8090
  tags:
    - Passwords
    - Security
    - Bitwarden
    - Family sharing
testing:
  smokeTests:
    - label: AMD64 container startup and restart
      status: Passed
      detail: Checked on 2026-09-27 using Autark-generated Compose with isolated loopback ports and temporary storage. This does not qualify setup, Tailscale, or restore.
    - label: Install, setup, and private access
      status: Needs end-to-end test
      detail: Validate the owner workflow on a clean host, including first-run setup and private access.
    - label: Raspberry Pi runtime
      status: Needs hardware test
      detail: ARM64 image support does not establish Raspberry Pi startup or performance.
    - label: Backup and restore
      status: Needs end-to-end test
      detail: Cold file copying stops the whole app; a populated backup and restore round trip is not yet qualified.

user:
  bestFor:
    - Password vaults
    - Secure notes
    - Sharing logins with trusted users
  highlights:
    - Works with Bitwarden browser and mobile apps
    - Encrypted vault storage
    - Browser and mobile vault sync
  plainLanguage: Vaultwarden stores password vaults on your server and works with Bitwarden clients. Use private HTTPS and test recovery before relying on it for important credentials.
technical:
  summary: Deploys Vaultwarden with local SQLite storage and managed data; private HTTPS must be configured before using the web vault.
  requirements:
    - 1 CPU core
    - 512 MB RAM
    - Persistent storage volume
    - Private HTTPS access required for the web vault
  includes:
    - Container image
    - SQLite database
    - Managed data folder for attachments and keys
    - Backup profile
  configuration:
    - label: Container name
      value: vaultwarden
    - label: Network
      value: autark-os-apps
    - label: Ports
      value: 8090:80
    - label: Data storage
      value: /var/lib/autark-os/apps/vaultwarden/data
    - label: Backup
      value: Stops the app to copy its managed data folders
    - label: Access
      value: Private HTTPS setup required
access:
  kind: web
  privateDashboard: true
  defaultMode: private
  privateAccessRecommended: true
  requiresFirstRunSetup: true
  notes:
    - Private HTTPS is required for browser cryptography and to protect credentials in transit.
    - First-run setup creates a vault account; the separate server admin panel is not enabled.
usage:
  kind: web-app
  privateHttpsRequired: true
  primaryAction: open-dashboard
  openUrlLabel: Open Vaultwarden
  headline: Create your private password vault
  summary: Open Vaultwarden, create the first account, then add one test item before moving your password manager.
  setupSteps:
    - Enable private HTTPS access in Autark-OS Access, then open that HTTPS link and create a vault account.
    - Add a test login and confirm it is available after signing out and back in.
    - Set the same private HTTPS server URL in each Bitwarden client before signing in.
  fields:
    - label: Web UI
      value: "{accessUrl}"
      sensitive: false
      qr: false
  notes:
    - Backups stop the app and copy managed folders; restore round-trip validation is still pending.
    - Keep Vaultwarden private; it stores credentials and secure notes.
health:
  type: http
  path: /alive
  startupGraceSeconds: 180
  successLabel: Password vault is ready
  startingLabel: Starting Vaultwarden
  failureLabel: Vaultwarden is not responding
  description: Autark-OS checks Vaultwarden's alive endpoint before calling the vault ready.
runtime:
  containerName: vaultwarden
  composeProject: autark-os-vaultwarden
  image: vaultwarden/server:1.36.0
  network: autark-os-apps
  runtimeRoot: /var/lib/autark-os/apps/vaultwarden
  ports:
    - 8090:80
  volumes:
    - /var/lib/autark-os/apps/vaultwarden/data:/data
  labels:
    - autark-os.managed=true
    - autark-os.app-id=vaultwarden
    - autark-os.version=1.36.0
  backupPaths:
    - data
  backupStrategy: cold_file
  backupContractVersion: 1
  privileged: false

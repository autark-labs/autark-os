name: Frontend visual regression

on:
  pull_request:
  push:
    branches:
      - main
      - development

jobs:
  browser-regression:
    name: Browser regression suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Install the Chromium test browser
        run: yarn playwright install --with-deps chromium

      - name: Validate Pro development simulator contracts
        working-directory: .
        run: node --test tools/pro-simulator/server.test.mjs

      - name: Run browser regression coverage
        run: yarn test:e2e

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14
